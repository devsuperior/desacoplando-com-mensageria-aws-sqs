server.port=8081
spring.application.name=ms-payment-ingestor

# Fila de destino (parametrizada via env)
app.queue.billing=${BILLING_QUEUE_NAME:billing-queue}

# Região AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Actuator (health check exposto para o ALB)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Padrão de log com MDC do correlation-id
logging.pattern.level=%5p [%X{correlationId:-}]
