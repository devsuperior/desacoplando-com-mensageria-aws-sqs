server.port=8082
spring.application.name=ms-billing

# Fila de origem (parametrizada via env)
app.queue.billing=${BILLING_QUEUE_NAME:billing-queue}

# Regiao AWS (credenciais vem da IAM Task Role do ECS em runtime)
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# ============================================================================
# Spring Cloud AWS. SQS Listener
# ----------------------------------------------------------------------------
# O starter autoconfigura o SqsMessageListenerContainerFactory sobre o
# SqsAsyncClient (cliente nao-bloqueante do AWS SDK v2, escolha do starter
# porque o listener polla continuamente). As propriedades abaixo substituem a
# necessidade de uma classe @Configuration explicita. Opcoes nao expostas em
# properties (ex.: messageAttributeNames, pollBackOffPolicy) exigem @Bean
# SqsMessageListenerContainerFactory customizado.
# ============================================================================

# Mensagens por ReceiveMessage. Default 10; deixado explicito
# para permitir override em runtime via env var na task definition.
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:10}

# WaitTimeSeconds do SQS. 20s = long polling (default recomendado AWS); 0s =
# short polling (apenas para demonstracao do custo, sobe NumberOfEmptyReceives).
# Default do framework e 10s; fixamos em 20s com sobrescrita via env.
spring.cloud.aws.sqs.listener.poll-timeout=${SQS_WAIT_TIME_SECONDS:20}s

# Teto de mensagens em voo por fila. Interage com max-messages-per-poll:
# com ambos em 10, o container abre uma poll por vez.
spring.cloud.aws.sqs.listener.max-concurrent-messages=10

# ----------------------------------------------------------------------------
# Configuracoes sem property global (documentadas aqui para referencia):
#
# AcknowledgementMode. Define quando o DeleteMessage e enviado ao SQS.
#   Default ON_SUCCESS (usado neste projeto): deleta se o handler retornar
#   sem excecao; em erro, a mensagem volta a fila apos o VisibilityTimeout.
#   Demais valores: ALWAYS (deleta sempre, arrisca perda em erro),
#   MANUAL (injete Acknowledgement e chame acknowledge()).
#   Override por listener: @SqsListener(acknowledgementMode = "MANUAL").
#
# ListenerMode, detectado pela assinatura do metodo.
#   SINGLE_MESSAGE (default) = 1 msg por invocacao; BATCH = List<T>.
# ============================================================================

# Banco de dados H2 em memoria (fiel ao artigo; persistencia real e roadmap futuro)
spring.datasource.url=jdbc:h2:mem:billingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Console H2 desabilitado em producao
spring.h2.console.enabled=false

# Actuator (health para liveness/readiness do ECS)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
