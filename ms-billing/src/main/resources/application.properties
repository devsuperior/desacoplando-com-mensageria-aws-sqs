server.port=8082
spring.application.name=ms-billing

# Fila de origem (parametrizada via env)
app.queue.billing=${BILLING_QUEUE_NAME:billing-queue}

# Controle de consumo SQS: batch size e tempo de espera (short vs long polling)
app.sqs.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:10}
app.sqs.wait-time-seconds=${SQS_WAIT_TIME_SECONDS:20}

# Região AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Banco de dados H2 em memória (fiel ao artigo; persistência real é roadmap futuro)
spring.datasource.url=jdbc:h2:mem:billingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Console H2 desabilitado em produção (habilite apenas via profile local)
spring.h2.console.enabled=false

# Actuator (health para liveness/readiness do ECS)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
